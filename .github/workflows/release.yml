name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.1.0. Leave blank to only build the APK."
        required: false
        default: ""

# Required for the job to create a tag and a GitHub Release.
permissions:
  contents: write

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the shared core module
        working-directory: android/core
        run: ./gradlew test

      - name: Build the APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      # A tag push releases itself; a manual run releases only when given a
      # tag, so a dispatch can never publish a release named after a branch.
      - name: Decide the release tag
        id: rel
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the APK under a release name
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          mkdir -p dist
          name="${TAG:-$(git rev-parse --short HEAD)}"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/jobhunt-${name}-debug.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: jobhunt-apk
          path: dist/*.apk

      - name: Publish the release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          notes="$(mktemp)"
          cat > "$notes" <<'NOTES'
          ## Install

          Download the `.apk` below and open it on your phone. Android will ask
          you to allow installs from this source the first time.

          Requires Android 8.0 (API 26) or newer.

          > This is a **debug-signed** build, which is what makes it directly
          > installable. It is not a Play Store build, and it installs under the
          > `.debug` package id so it can sit alongside another copy.

          ## First run

          1. **Profile** — add the job titles you want, plus your skills. You can
             type these in directly; a resume is optional.
          2. **Resumes** *(optional)* — upload PDF, DOCX, Markdown or text to fill
             the profile in quickly, then prune anything irrelevant.
          3. **Home** — set your locations, then tap **Hunt now**. Leave the daily
             hunt switched on and it runs itself from then on.

          Everything happens on the device: no account, no server, no API keys.
          NOTES

          # Re-running a tag refreshes it rather than failing, so a release can
          # be rebuilt after a fix without inventing a new version number.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — refreshing its APK and notes."
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist/*.apk \
              --target "$GITHUB_SHA" \
              --title "JobHunt $TAG" \
              --notes-file "$notes"
          fi
