name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Required for the job to create a GitHub Release.
permissions:
  contents: write

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the shared core module
        working-directory: android/core
        run: ./gradlew test

      - name: Build the APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Stage the APK under a release name
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/jobhunt-${GITHUB_REF_NAME}-debug.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: jobhunt-apk
          path: dist/*.apk

      # Only a tag push produces a release; a manual run just leaves the
      # artifact above, so it can't publish a release named after a branch.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "JobHunt $GITHUB_REF_NAME" \
            --notes "$(cat <<'NOTES'
          ## Install

          Download the `.apk` below and open it on your phone. Android will ask
          you to allow installs from this source the first time.

          Requires Android 8.0 (API 26) or newer.

          > This is a **debug-signed** build, which is what makes it directly
          > installable. It is not a Play Store build, and it installs under the
          > `.debug` package id so it can sit alongside another copy.

          ## First run

          1. **Resumes** — add one or more (PDF, DOCX, Markdown, or text).
          2. **Home** — set your locations, then tap **Hunt now**.
          3. Leave the daily hunt switched on and it runs itself from then on.

          Everything happens on the device: no account, no server, no API keys.
          NOTES
          )"
